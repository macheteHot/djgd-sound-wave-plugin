[package]
name = "djgd-sound-wave-plugin"
version = "0.1.0"
edition = "2024"
description = "捕获系统正在播放的声音，生成波形 JSON，POST 到本地 lhm /inject 端点（Windows x64 插件）"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 只 POST 本地 http，不需要 TLS；default-features = false 避免拉入 ring（C 编译）
ureq = { version = "3.4.0", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
